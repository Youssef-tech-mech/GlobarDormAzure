<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Global Dorm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: auto;
            text-align: center;
            padding: 50px 20px;
        }
        h1 {
            font-size: 2.5em;
            color: #333;
        }
        p {
            font-size: 1.2em;
            color: #666;
        }
        .button-container {
            margin-top: 30px;
        }
        .button {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1em;
            color: white;
            background-color: #5cb85c;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .button:hover {
            background-color: #4cae4c;
        }
        .button-secondary {
            background-color: #0275d8;
        }
        .button-secondary:hover {
            background-color: #025aa5;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Welcome to Global Dorm</h1>
    <p>Manage your dorms with ease. Register or log in to get started!</p>
    <div class="button-container">
        <a href="/register" class="button">Register</a>
        <a href="/login" class="button button-secondary">Login</a>
    </div>
</div>
</body>
</html>
