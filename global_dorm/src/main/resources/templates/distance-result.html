<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .section {
            margin-bottom: 20px;
        }
        .section h2 {
            color: #0275d8;
            border-bottom: 2px solid #0275d8;
            padding-bottom: 5px;
        }
        .route, .waypoint {
            background-color: #f9f9f9;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .button-container {
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #0275d8;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #025aa5;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Distance Results</h1>

    <!-- Display start and end postcodes -->
    <div class="section">
        <h2>Route Information</h2>
        <p>Start Postcode: <span th:text="${startPostcode}"></span></p>
        <p>End Postcode: <span th:text="${endPostcode}"></span></p>
    </div>

    <!-- Routes Section -->
    <div class="section">
        <h2>Routes</h2>
        <div th:each="route : ${routes}" class="route">
            <p>Distance: <span th:text="${route.formattedDistance}"></span></p>
            <p>Duration: <span th:text="${route.formattedDuration}"></span></p>
        </div>
    </div>

    <!-- Waypoints Section -->
    <div class="section">
        <h2>Waypoints</h2>
        <div th:each="waypoint : ${waypoints}" class="waypoint">
            <p>Name: <span th:text="${waypoint.name}"></span></p>
            <p>Location: <span th:text="${waypoint.location}"></span></p>
        </div>
    </div>

    <div class="button-container">
        <button onclick="window.location.href='/api/distance';">Back to Distance Form</button>
    </div>
</div>
</body>
</html>
