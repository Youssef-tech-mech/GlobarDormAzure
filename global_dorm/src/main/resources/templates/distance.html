<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input, select, button {
            padding: 8px; /* Thinner buttons */
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #0275d8;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #025aa5;
        }
        .home-button {
            background-color: #5cb85c; /* Green color */
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .home-button:hover {
            background-color: #4cae4c; /* Darker green on hover */
        }
        .button-container {
            display: flex;
            justify-content: space-between;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Distance Calculator</h1>
    <!-- Display error message -->
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form action="/api/distance/calculate" method="GET">
        <label for="profile">Travel Mode:</label>
        <select id="profile" name="profile" required>
            <option value="driving">Driving</option>
            <option value="cycling">Cycling</option>
            <option value="walking">Walking</option>
        </select>

        <label for="startCity">Start City <span class="optional">(optional)</span>:</label>
        <input type="text" id="startCity" name="startCity" placeholder="e.g., Nottingham">

        <label for="startPostcode">Start Postcode <span class="optional">(optional)</span>:</label>
        <input type="text" id="startPostcode" name="startPostcode" placeholder="e.g., NG3 1NB">

        <label for="roomID">Select Starting Room <span class="optional">(optional)</span>:</label>
        <select id="roomID" name="roomID" onchange="updateFieldsBasedOnRoom()">
            <option value="" data-postcode="">None</option>
            <option th:each="room : ${rooms}"
                    th:value="${room.roomID}"
                    th:data-postcode="${room.postcode}"
                    th:text="${room.name}"></option>
        </select>

        <label for="endCity">End City <span class="optional">(optional)</span>:</label>
        <input type="text" id="endCity" name="endCity" placeholder="e.g., London">

        <label for="endPostcode">End Postcode <span class="optional">(optional)</span>:</label>
        <input type="text" id="endPostcode" name="endPostcode" placeholder="e.g., SE1 0SW" required>

        <div class="button-container">
            <button type="submit">Calculate Distance</button>
            <button type="button" class="home-button" onclick="window.location.href='/dashboard'">Home</button>
        </div>
    </form>
</div>

<script>
    function updateFieldsBasedOnRoom() {
        const roomSelect = document.getElementById("roomID");
        const selectedOption = roomSelect.options[roomSelect.selectedIndex];
        const postcode = selectedOption.getAttribute("data-postcode");
        const startCityInput = document.getElementById("startCity");
        const startPostcodeInput = document.getElementById("startPostcode");

        if (roomSelect.value) {
            // Disable start city and postcode inputs when a room is selected
            startCityInput.disabled = true;
            startPostcodeInput.disabled = true;
            startPostcodeInput.value = postcode || ""; // Populate start postcode if available
        } else {
            // Enable start city and postcode inputs when no room is selected
            startCityInput.disabled = false;
            startPostcodeInput.disabled = false;
            startPostcodeInput.value = ""; // Clear start postcode
        }
    }
</script>
</body>
</html>
