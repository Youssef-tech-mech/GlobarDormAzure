<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      padding: 20px;
    }
    .header, .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header {
      margin-bottom: 20px;
    }
    .title {
      text-align: center;
      flex-grow: 1;
    }
    .title h1 {
      font-size: 2.5em;
      color: #333;
    }
    .link {
      display: block;
      padding: 10px 15px;
      font-size: 1em;
      color: white;
      background-color: #0275d8;
      text-decoration: none;
      border-radius: 5px;
      text-align: center;
    }
    .link:hover {
      background-color: #025aa5;
    }
    .apply {
      background-color: #5cb85c;
    }
    .apply:hover {
      background-color: #4cae4c;
    }
    .logout {
      background-color: #d9534f;
      align-self: flex-end;
    }
    .logout:hover {
      background-color: #c9302c;
    }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    .menu .link {
      width: 100%;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header Section -->
  <div class="header">
    <a href="/profile/page" class="link">My Profile</a>
    <div class="title">
      <h1>Welcome, <span th:text="${user.name}">User</span>!</h1>
    </div>
    <a href="/applications/form" class="link apply">Apply</a>
  </div>

  <!-- Menu Section -->
  <div class="menu">
    <a href="/api/distance" class="link">Distance API</a>
    <a href="/api/rooms/all" class="link">Rooms</a>
    <a href="/applications" class="link">My Applications</a>
    <a href="/weather" class="link">Weather</a>
  </div>

  <!-- Footer Section -->
  <div class="footer">
    <a href="/logout" class="link logout">Log Out</a>
  </div>
</div>
</body>
</html>
