# ============================================================
# Server Configuration
# ============================================================
server.port=8080
server.servlet.context-path=/

# ============================================================
# Logging Configuration
# ============================================================
logging.level.org.springframework=INFO
logging.level.root=INFO
logging.file.name=logs/global_dorm.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================================
# API Configurations
# ============================================================
# Distance API
distance.api.url=https://router.project-osrm.org/route/v1/driving

# Weather API (Example with free API that doesn't require a key)
weather.api.url=https://api.openweathermap.org/data/2.5/weather
weather.api.key=299e6a0bc2a0d4db0f8212a0e992f3c4



# ============================================================
# Database Configuration (For later use)
# Uncomment and set these when integrating a database
