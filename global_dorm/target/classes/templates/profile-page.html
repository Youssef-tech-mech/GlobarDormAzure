<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #4CAF50;
        }

        p {
            font-size: 1.1em;
            margin: 10px 0;
        }

        .form-section {
            margin-top: 30px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
        }

        .delete-btn {
            background-color: #f44336;
        }

        .delete-btn:hover {
            background-color: #d32f2f;
        }

        .back-btn {
            margin-top: 20px;
            background-color: #0275d8;
        }

        .back-btn:hover {
            background-color: #025aa5;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            font-size: 1em;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
    <script>
        function validatePassword(password) {
            const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,}$/;
            return passwordPattern.test(password);
        }

        async function updatePassword(event) {
            event.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
                const response = await fetch('/profile/update-password', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        currentPassword,
                        newPassword,
                    }),
                });

                if (!response.ok) {
                    const errorMessage = await response.text();
                    alert(`Error: ${errorMessage}`);
                } else {
                    const result = await response.text();
                    alert(`Success: ${result}`);
                }
            } catch (error) {
                console.error('Error updating password:', error);
                alert('An error occurred.');
            }
        }

        async function deleteAccount(event) {
            event.preventDefault();

            const response = await fetch('/profile/delete-account', { method: 'POST' });
            const result = await response.text();

            if (result.startsWith('success')) {
                alert('Your account has been deleted.');
                window.location.href = '/login';
            } else {
                handleResponse(result, "Account deletion");
            }
        }

        function handleResponse(result, action) {
            const messageDiv = document.getElementById('message');
            if (result.startsWith('success')) {
                messageDiv.className = 'message success';
            } else {
                messageDiv.className = 'message error';
            }
            messageDiv.textContent = `${action} result: ${result.replace(/^(success|error):\s*/, '')}`;
        }

        function goToDashboard() {
            window.location.href = '/dashboard'; // Adjust the path to your dashboard URL
        }
    </script>
</head>
<body>
<div class="container">
    <h1>User Profile</h1>

    <p><strong>Username:</strong> <span th:text="${user.name}">Default Username</span></p>
    <p><strong>Email:</strong> <span th:text="${user.email}">Default Email</span></p>
    <p><strong>Role:</strong> <span th:text="${user.role}">Default Role</span></p>

    <div id="message" class="message"></div>

    <div class="form-section">
        <h2>Update Password</h2>
        <form onsubmit="updatePassword(event)">
            <label for="currentPassword">Current Password:</label>
            <input type="password" id="currentPassword" name="currentPassword" required>

            <label for="newPassword">New Password:</label>
            <input type="password" id="newPassword" name="newPassword" required>

            <button type="submit">Update Password</button>
        </form>
    </div>

    <div class="form-section">
        <h2>Delete Account</h2>
        <form onsubmit="deleteAccount(event)">
            <p>Are you sure you want to delete your account? This action cannot be undone.</p>
            <button type="submit" class="delete-btn">Delete Account</button>
        </form>
    </div>

    <button class="back-btn" onclick="goToDashboard()">Back to Dashboard</button>
</div>
</body>
</html>
