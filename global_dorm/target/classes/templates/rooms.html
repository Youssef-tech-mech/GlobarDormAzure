<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Rooms</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .filter-sort {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .filter-sort select,
        .filter-sort input[type="number"],
        .filter-sort button {
            margin: 5px;
            padding: 8px;
            font-size: 14px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background-color: #0275d8;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .actions a {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            text-decoration: none;
            color: white;
            border-radius: 5px;
            font-size: 14px;
        }
        .apply {
            background-color: #5cb85c;
        }
        .apply:hover {
            background-color: #4cae4c;
        }
        .distance {
            background-color: #0275d8;
        }
        .distance:hover {
            background-color: #025aa5;
        }
        .loading {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #555;
        }
        .error {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: red;
        }
    </style>
</head>
<body>
<h1>Available Rooms</h1>

<!-- Filter and Sort Controls -->
<div class="filter-sort">
    <div>
        <label for="cityFilter">City:</label>
        <select id="cityFilter">
            <option value="">All</option>
        </select>

        <label for="languageFilter">Language:</label>
        <select id="languageFilter">
            <option value="">All</option>
        </select>

        <label for="availabilityFilter">Availability:</label>
        <select id="availabilityFilter">
            <option value="">All</option>
            <option value="available">Available</option>
            <option value="notAvailable">Not Available</option>
        </select>

        <label for="furnishedFilter">Furnished:</label>
        <select id="furnishedFilter">
            <option value="">All</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div>
        <label for="priceMin">Min Price (£):</label>
        <input type="number" id="priceMin" placeholder="Min">

        <label for="priceMax">Max Price (£):</label>
        <input type="number" id="priceMax" placeholder="Max">

        <label for="sort">Sort By:</label>
        <select id="sort">
            <option value="az">Name A-Z</option>
            <option value="priceLowHigh">Price: Low to High</option>
            <option value="priceHighLow">Price: High to Low</option>
        </select>
    </div>
    <button onclick="applyFilters()">Apply</button>
</div>

<div class="loading" id="loading">Loading rooms...</div>
<table id="rooms-table" style="display: none;">
    <thead>
    <tr>
        <th>Room ID</th>
        <th>Name</th>
        <th>City</th>
        <th>County</th>
        <th>Postcode</th>
        <th>Furnished</th>
        <th>Amenities</th>
        <th>Price per Month (£)</th>
        <th>Availability</th>
        <th>Spoken Languages</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody id="rooms-table-body">
    <!-- Rows will be dynamically added here -->
    </tbody>
</table>
<div class="error" id="error" style="display: none;">Error loading room data. Please try again later.</div>

<script>
    let rooms = []; // Store all rooms for filtering and sorting

    // Fetch room data from the backend
    fetch('/api/rooms/data')
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            rooms = data; // Store the data for later filtering/sorting
            populateFilters(data);
            renderRooms(data);
        })
        .catch(error => {
            console.error('Error fetching room data:', error);
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            loading.style.display = 'none';
            errorDiv.style.display = 'block';
        });

    // Populate filter dropdowns
    function populateFilters(data) {
        const cityFilter = document.getElementById('cityFilter');
        const languageFilter = document.getElementById('languageFilter');

        const cities = [...new Set(data.map(room => room.city).filter(city => city))];
        const languages = [...new Set(data.flatMap(room => room.spokenLanguages || []))];

        cities.forEach(city => {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city;
            cityFilter.appendChild(option);
        });

        languages.forEach(language => {
            const option = document.createElement('option');
            option.value = language;
            option.textContent = language;
            languageFilter.appendChild(option);
        });
    }

    // Render rooms based on filtered and sorted data
    function renderRooms(filteredRooms) {
        const tableBody = document.getElementById('rooms-table-body');
        const loading = document.getElementById('loading');
        const table = document.getElementById('rooms-table');
        const errorDiv = document.getElementById('error');

        // Clear existing rows
        tableBody.innerHTML = '';

        // Hide loading/error and show table
        loading.style.display = 'none';
        errorDiv.style.display = 'none';
        table.style.display = 'table';

        // Render each room
        filteredRooms.forEach(room => {
            const isAvailableText = room.isAvailable ? 'Available' : 'Not Available';
            const applyLink = room.isAvailable
                ? `<a href="http://localhost:8080/applications/form" class="apply">Apply</a>`
                : '';
            const distanceLink = `<a href="http://localhost:8080/api/distance" class="distance">Get Distance</a>`;
            const spokenLanguages = room.spokenLanguages ? room.spokenLanguages.join(', ') : 'N/A';

            const row = `
                <tr>
                    <td>${room.roomID}</td>
                    <td>${room.name}</td>
                    <td>${room.city || 'N/A'}</td>
                    <td>${room.county || 'N/A'}</td>
                    <td>${room.postcode || 'N/A'}</td>
                    <td>${room.furnished ? 'Yes' : 'No'}</td>
                    <td>${room.amenities ? room.amenities.join(', ') : 'N/A'}</td>
                    <td>${room.pricePerMonthGbp}</td>
                    <td>${isAvailableText}</td>
                    <td>${spokenLanguages}</td>
                    <td>${applyLink} ${distanceLink}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // Apply filters and sorting
    function applyFilters() {
        const city = document.getElementById('cityFilter').value;
        const language = document.getElementById('languageFilter').value;
        const availability = document.getElementById('availabilityFilter').value;
        const furnished = document.getElementById('furnishedFilter').value;
        const minPrice = document.getElementById('priceMin').value;
        const maxPrice = document.getElementById('priceMax').value;
        const sort = document.getElementById('sort').value;

        let filteredRooms = rooms;

        // Filter by city
        if (city) {
            filteredRooms = filteredRooms.filter(room => room.city === city);
        }

        // Filter by language
        if (language) {
            filteredRooms = filteredRooms.filter(room => room.spokenLanguages && room.spokenLanguages.includes(language));
        }

        // Filter by availability
        if (availability) {
            filteredRooms = filteredRooms.filter(room => room.isAvailable === (availability === 'available'));
        }

        // Filter by furnished
        if (furnished) {
            filteredRooms = filteredRooms.filter(room => room.furnished === (furnished === 'yes'));
        }

        // Filter by price range
        if (minPrice) {
            filteredRooms = filteredRooms.filter(room => room.pricePerMonthGbp >= Number(minPrice));
        }
        if (maxPrice) {
            filteredRooms = filteredRooms.filter(room => room.pricePerMonthGbp <= Number(maxPrice));
        }

        // Sort the data
        if (sort === 'az') {
            filteredRooms.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sort === 'priceLowHigh') {
            filteredRooms.sort((a, b) => a.pricePerMonthGbp - b.pricePerMonthGbp);
        } else if (sort === 'priceHighLow') {
            filteredRooms.sort((a, b) => b.pricePerMonthGbp - a.pricePerMonthGbp);
        }

        // Render filtered and sorted rooms
        renderRooms(filteredRooms);
    }
</script>
</body>
</html>
